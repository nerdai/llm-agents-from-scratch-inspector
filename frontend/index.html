<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Inspector</title>
    <style>
      /*
       * A startup splash, visible the instant the tab loads -- before
       * the JS bundle (React, index.css's real design tokens, ...) has
       * even been fetched, let alone executed. `agent-inspector
       * launch` opens the browser on a fixed short delay rather than
       * waiting for the backend/Vite dev server to actually confirm
       * they're ready, and a script with a slow import chain (a
       * cloud-hosted LLM client, heavy dependencies, ...) can leave
       * this genuinely showing for a few real seconds -- a blank white
       * `#root` in that window reads as broken, not "still starting".
       * Plain inline styles (no Tailwind/shadcn tokens -- those load
       * as part of the same JS bundle this exists to cover for), with
       * a `prefers-color-scheme` fallback for dark since the app's own
       * `.dark` class toggle (next-themes) hasn't run yet either.
       *
       * Scoped to `#startup-splash`, a child of `#root`, deliberately
       * -- NOT to `#root` itself. `createRoot(...).render(...)`
       * (main.tsx) replaces `#root`'s *children*, so `#startup-splash`
       * (and every rule below that targets it) simply has no matching
       * element once the real app mounts. A `<style>` tag has no such
       * lifecycle of its own -- rules written against `#root` directly
       * would keep applying to whatever React put there instead,
       * permanently forcing the real app into a centered flex box.
       */
      #startup-splash {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #fdfcfa;
        color: #8a8578;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 0.8125rem;
      }
      @media (prefers-color-scheme: dark) {
        #startup-splash {
          background: #1a1815;
          color: #a39d8e;
        }
        #startup-spinner {
          border-color: #322e4a;
          border-top-color: #8385f0;
        }
      }
      #startup-spinner {
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid #eeecf9;
        border-top-color: #4f52e0;
        border-radius: 50%;
        animation: startup-spin 0.7s linear infinite;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-splash">
        <div id="startup-spinner"></div>
        <span>Starting Agent Inspector…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
